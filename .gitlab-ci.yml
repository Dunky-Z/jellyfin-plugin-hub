stages:
  - test
  - sync

test:
  stage: test
  image: python:3.12
  script:
    - python3 -m unittest discover -s tests -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

sync:
  stage: sync
  image: python:3.12
  needs:
    - test
  script:
    - python3 sync.py
  artifacts:
    paths:
      - dist/manifest.json
      - dist/status.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - sources.json
        - sync.py
